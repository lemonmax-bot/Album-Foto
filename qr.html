<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kartu QR pernikahan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* Font asli: taruh file di folder fonts/ dengan nama persis seperti di bawah. Jika belum ada, dipakai font pengganti. */
@font-face{font-family:'Dream Avenue';src:url(fonts/dream-avenue.ttf) format('truetype'),url(fonts/dream-avenue.otf) format('opentype')}
@font-face{font-family:'Burgues Script';src:url(fonts/burgues-script.ttf) format('truetype'),url(fonts/burgues-script.otf) format('opentype')}
@page{size:A5;margin:0}
body{margin:0;background:#e6ded0;font-family:Georgia,serif;color:#2a2118}
.ctl{max-width:520px;margin:16px auto;padding:0 16px;display:grid;gap:8px}
.ctl input,.ctl select,.ctl button{font:inherit;padding:10px;border-radius:6px;border:1px solid #bfb4a2}
.ctl button{background:#5B1B31;color:#fff;border:0;cursor:pointer}
.card{--wine:#5B1B31;--olive:#808000;--bg:#fbf4ec;--ink:#5B1B31;position:relative;width:148mm;height:210mm;margin:16px auto;background:var(--bg);color:var(--ink);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 24px #0003;overflow:hidden}
.card.dark{--bg:#5B1B31;--ink:#fbf4ec;--olive:#a3a31a}
.card::before{content:"";position:absolute;inset:7mm;border:.4mm solid var(--olive)}
.card::after{content:"";position:absolute;inset:9mm;border:.2mm solid var(--wine);opacity:.5}
.card.dark::after{border-color:var(--olive)}
.co{position:absolute;width:44mm;height:44mm}
.co.a{top:9mm;left:9mm}.co.b{top:9mm;right:9mm;transform:scaleX(-1)}.co.c{bottom:9mm;left:9mm;transform:scaleY(-1)}.co.d{bottom:9mm;right:9mm;transform:scale(-1)}
h1,h2,p{margin:0;font-weight:500}
.kick{font-family:'Burgues Script','Great Vibes',cursive;font-size:9mm;color:var(--olive)}
h1{font-family:'Dream Avenue','Pinyon Script',cursive;font-size:16mm;line-height:1.05;margin:3mm 0 1mm;max-width:104mm;color:var(--ink)}
.date{font-family:'Cormorant Garamond',Georgia,serif;font-size:4.8mm;letter-spacing:.6mm;font-weight:600}
.plate{background:#fff;padding:5mm;border-radius:4mm;margin:7mm 0 5mm;border:.5mm solid var(--olive);line-height:0}
.plate div{display:inline-block}
h2{font-family:'Burgues Script','Great Vibes',cursive;font-size:10mm;color:var(--ink)}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-size:4.6mm;margin-top:2mm;max-width:88mm;font-weight:600}
@media print{body{background:none}.ctl{display:none}.card{margin:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="ctl">
  <input id="n" value="Nama & Nama" aria-label="Nama pengantin">
  <input id="d" value="12 Desember 2026" aria-label="Tanggal">
  <input id="u" aria-label="Alamat halaman tamu">
  <select id="t" aria-label="Latar"><option value="">Latar gading</option><option value="dark">Latar burgundy</option></select>
  <button id="p">Cetak atau simpan PDF (ukuran A5)</button>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rose" viewBox="-12 -12 24 24"><circle r="11" fill="var(--wine)"/><circle r="7.5" fill="none" stroke="var(--bg)" stroke-width=".8" opacity=".7"/><path d="M0 0c2-1 3 1 2 3s-5 2-6-1 2-6 6-5 7 4 6 8" fill="none" stroke="var(--bg)" stroke-width=".9" opacity=".85"/></symbol>
<symbol id="o" viewBox="0 0 120 120">
 <path d="M4 116C4 62 40 20 116 4" fill="none" stroke="var(--olive)" stroke-width="1.3"/>
 <g fill="var(--olive)"><ellipse cx="12" cy="98" rx="9" ry="3.4" transform="rotate(-80 12 98)"/><ellipse cx="20" cy="80" rx="11" ry="4" transform="rotate(-62 20 80)"/>
 <ellipse cx="40" cy="48" rx="12" ry="4" transform="rotate(-42 40 48)"/><ellipse cx="68" cy="28" rx="12" ry="4" transform="rotate(-22 68 28)"/><ellipse cx="98" cy="12" rx="11" ry="3.8" transform="rotate(-8 98 12)"/>
 <ellipse cx="30" cy="70" rx="10" ry="3.6" transform="rotate(28 30 70)" opacity=".75"/><ellipse cx="52" cy="46" rx="10" ry="3.6" transform="rotate(38 52 46)" opacity=".75"/><ellipse cx="82" cy="26" rx="9" ry="3.4" transform="rotate(48 82 26)" opacity=".75"/>
 <ellipse cx="14" cy="60" rx="9" ry="3.4" transform="rotate(-30 14 60)" opacity=".75"/></g>
 <g fill="var(--wine)"><circle cx="22" cy="92" r="2.2"/><circle cx="27" cy="88" r="2"/><circle cx="62" cy="40" r="2.2"/><circle cx="90" cy="22" r="2"/><circle cx="96" cy="26" r="1.8"/></g>
 <use href="#rose" x="28" y="28" width="30" height="30"/><use href="#rose" x="8" y="64" width="17" height="17" opacity=".95"/><use href="#rose" x="62" y="6" width="17" height="17" opacity=".95"/>
</symbol></defs></svg>
<div class="card" id="card">
 <svg class="co a"><use href="#o"/></svg><svg class="co b"><use href="#o"/></svg><svg class="co c"><use href="#o"/></svg><svg class="co d"><use href="#o"/></svg>
 <p class="kick">Abadikan momen kami</p>
 <h1 id="hn"></h1><p class="date" id="hd"></p>
 <div class="plate"><div id="q"></div></div>
 <h2>Scan, lalu potret 5 fotomu</h2>
 <p class="sub">Tanpa aplikasi. Foto dari semua tamu berkumpul dalam satu album untuk kami kenang.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);$('u').value=location.href.replace(/qr\.html.*$/,'');
function draw(){$('hn').textContent=$('n').value;$('hd').textContent=$('d').value;$('card').className='card '+$('t').value;
 $('q').innerHTML='';new QRCode($('q'),{text:$('u').value,width:190,height:190,colorDark:'#5B1B31',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
['n','d','u','t'].forEach(i=>$(i).oninput=draw);$('p').onclick=()=>print();draw();
</script></body></html>
